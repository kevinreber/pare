name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 16
        uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --watchAll=false
        env:
          CI: true

      - name: Build
        run: npm run build
        env:
          CI: true
          REACT_APP_FIREBASE_API_KEY: fake-key-for-ci
          REACT_APP_FIREBASE_AUTH_DOMAIN: fake.firebaseapp.com
          REACT_APP_FIREBASE_DATABASE_URL: https://fake.firebaseio.com
          REACT_APP_FIREBASE_PROJECT_ID: fake-project
          REACT_APP_FIREBASE_STORAGE_BUCKET: fake.appspot.com
          REACT_APP_FIREBASE_MESSAGING_SENDER_ID: 000000000000
          REACT_APP_FIREBASE_APP_ID: 1:000000000000:web:fake
          REACT_APP_FIREBASE_MEASUREMENT_ID: G-FAKE
